area_id: "90-archive"
area_name: "Archive"
version: "1.0.0"
last_updated: "2025-01-09"

description: >
  Permanent storage for deprecated, duplicate, and legacy content that is no longer
  actively used but must be retained for historical, reference, or compliance purposes.

intended_agents:
  - type: "archive_manager"
    capabilities: ["content_archival", "index_maintenance", "retrieval"]
  - type: "deduplication_agent"
    capabilities: ["hash_computation", "duplicate_detection", "archival"]
  - type: "compliance_auditor"
    capabilities: ["retention_policy", "audit_trail", "verification"]

objectives:
  primary:
    - "Preserve historical content and maintain institutional memory"
    - "Store and track duplicate files for potential recovery"
    - "Maintain clean active workspace by archiving obsolete content"
  secondary:
    - "Enable recovery of archived content when needed"
    - "Provide audit trail for compliance purposes"
    - "Optimize storage through deduplication"

scope:
  included:
    - "Exact duplicate files detected by hash"
    - "Superseded or deprecated documentation"
    - "Legacy scripts and tools no longer in use"
    - "Old organizational structures"
    - "Historical versions of evolving content"
  
  excluded:
    - "Active content still in use"
    - "Unique files (even if old)"
    - "Content that should be permanently deleted"
    - "Personal or sensitive information (should never be committed)"

inputs:
  - type: "duplicate_candidates"
    source: "automated_deduplication"
    description: "Files identified as duplicates by hash comparison"
  
  - type: "legacy_content"
    source: "manual_identification"
    description: "Outdated or superseded content flagged for archival"
  
  - type: "metadata"
    source: "archival_process"
    description: "Context about why and when content was archived"

outputs:
  - type: "archived_files"
    locations: ["duplicates/", "legacy/"]
    description: "Preserved content in organized structure"
  
  - type: "duplicate_index"
    file: "duplicates/duplicates-index.csv"
    description: "Comprehensive record of all duplicates"
  
  - type: "legacy_documentation"
    location: "legacy/*/README.md"
    description: "Context and metadata for archived content"

policies:
  archival_rules:
    - "Never delete from archive without explicit authorization"
    - "Maintain append-only index for duplicates"
    - "Preserve original file paths in metadata"
    - "Document reason for all archival operations"
    - "Verify hash integrity periodically"
  
  duplicate_handling:
    - "Keep one copy in active location (usually oldest or most canonical)"
    - "Archive all other exact copies"
    - "Record all copies in duplicates-index.csv"
    - "Preserve enough metadata to restore if needed"
  
  legacy_handling:
    - "Create dated subdirectory for each archival batch"
    - "Include README explaining context"
    - "Preserve original directory structure"
    - "Link to superseding content if applicable"
  
  retention:
    - "Retain duplicates for minimum 1 year"
    - "Retain legacy content permanently unless explicitly obsolete"
    - "Follow organizational compliance requirements"
    - "Document any deletions from archive"

quality_checks:
  before_archival:
    - "Verify content is truly duplicate or obsolete"
    - "Check if content is referenced elsewhere"
    - "Ensure metadata is complete"
    - "Confirm backup exists"
  
  during_archival:
    - "Compute and record SHA-256 hash"
    - "Update duplicate index"
    - "Create or update README in legacy/"
    - "Log operation in operations logs"
  
  after_archival:
    - "Verify file was copied correctly"
    - "Confirm index was updated"
    - "Validate active references updated if needed"

operations:
  archiving_duplicate:
    steps:
      - "Compute SHA-256 hash of file"
      - "Check if hash already exists in index"
      - "Determine which copy to keep (usually first/canonical)"
      - "Move duplicate(s) to 90-archive/duplicates/"
      - "Preserve relative path structure"
      - "Append entry to duplicates-index.csv"
      - "Log operation in 21-github-and-copilot-tech/02-operations-logs/"
    
    index_entry_format:
      - "original_path: Path to kept copy"
      - "duplicate_path: Original path of duplicate"
      - "sha256_hash: Content hash"
      - "size_bytes: File size"
      - "archived_date: ISO 8601 timestamp"
      - "detected_by: Tool or agent name"
  
  archiving_legacy:
    steps:
      - "Create dated subdirectory in legacy/"
      - "Move content preserving structure"
      - "Create README with context"
      - "Update references in active content"
      - "Log operation"
    
    readme_requirements:
      - "Date Archived"
      - "Reason for archival"
      - "Superseded By (if applicable)"
      - "Original Location"
      - "Additional Notes"
  
  recovering_content:
    steps:
      - "Locate in archive (check indices)"
      - "Review metadata and context"
      - "Verify hash if duplicate"
      - "Copy to new location (don't move from archive)"
      - "Update as needed for current standards"
      - "Log recovery operation"

duplicate_detection:
  algorithm: "SHA-256 hash comparison"
  
  process:
    - "Compute hash for all files in scope"
    - "Group files by hash value"
    - "Files with same hash are exact duplicates"
    - "Ignore files in .git, node_modules, etc."
  
  considerations:
    - "Identical content = duplicate even if different names"
    - "Different paths to same content = duplicate"
    - "Whitespace-only differences = still duplicate"
    - "Small binary differences = not duplicate"

index_management:
  duplicates_index_csv:
    location: "duplicates/duplicates-index.csv"
    format: "CSV with header row"
    encoding: "UTF-8"
    
    schema:
      original_path:
        type: "string"
        description: "Relative path to kept copy"
        example: "10-product-guide/GUIA-COMPLETO.md"
      
      duplicate_path:
        type: "string"
        description: "Original path of duplicate before archival"
        example: "00-VISAO-GERAL/GUIA-COMPLETO.md"
      
      sha256_hash:
        type: "string"
        format: "64 hex characters"
        description: "SHA-256 hash of file content"
      
      size_bytes:
        type: "integer"
        description: "File size in bytes"
      
      archived_date:
        type: "string"
        format: "ISO 8601 (YYYY-MM-DDTHH:MM:SSZ)"
        description: "When duplicate was archived"
      
      detected_by:
        type: "string"
        description: "Tool or process that found duplicate"
        examples: ["reorg.py", "manual_review"]
    
    maintenance:
      - "Append-only (never delete rows)"
      - "Sort by archived_date for chronology"
      - "Validate CSV structure regularly"
      - "Include header row always"

cross_references:
  related_areas:
    - area: "40-scripts"
      relationship: "Scripts perform automated archival"
      guidance: "reorg.py populates duplicates/, updates index"
    
    - area: "21-github-and-copilot-tech"
      relationship: "Operations logs document archival actions"
      guidance: "Log all archival operations in 02-operations-logs/"
    
    - area: "00-governance-and-origins"
      relationship: "Governance protocols define archival rules"
      guidance: "Follow archival protocols from 03-protocols/"
    
    - area: "all_active_areas"
      relationship: "Any content may be archived"
      guidance: "Update cross-references when archiving"

best_practices:
  for_automated_archival:
    - "Always run in dry-run mode first"
    - "Review list of files to be archived"
    - "Verify index is updated correctly"
    - "Keep detailed logs"
  
  for_manual_archival:
    - "Document reason thoroughly"
    - "Notify team if content is referenced elsewhere"
    - "Create comprehensive README"
    - "Update any links or references"
  
  for_recovery:
    - "Copy from archive, don't move"
    - "Verify hash if recovering duplicate"
    - "Update content to current standards"
    - "Document recovery rationale"

common_pitfalls:
  - "Archiving unique content by mistake"
  - "Not updating duplicate index"
  - "Insufficient metadata for legacy content"
  - "Breaking references when archiving"
  - "Not preserving directory structure"
  - "Deleting instead of archiving"

metrics_to_track:
  - "Total archived items"
  - "Storage saved through deduplication"
  - "Archival operations per month"
  - "Recovery requests per quarter"
  - "Archive size growth rate"
  - "Index completeness percentage"

security_considerations:
  - "Ensure no secrets in archived content"
  - "Maintain same access controls as source"
  - "Audit archived content periodically"
  - "Consider encryption for sensitive archives"

future_enhancements:
  - "Automated compression of old archives"
  - "Search interface for archived content"
  - "Automated hash verification"
  - "Retention policy automation"
  - "Archive statistics dashboard"
  - "Integration with backup systems"

notes:
  - "Archive is append-only by design - prioritize preservation"
  - "When in doubt about archival, keep content in active location"
  - "Duplicate detection is content-based, not name-based"
  - "Legacy content should be recoverable with context"
  - "Maintain indices even if files are compressed or moved to cold storage"

metadata:
  primary_purpose: "preservation"
  secondary_purpose: "deduplication"
  write_frequency: "low"
  read_frequency: "very_low"
  criticality: "medium"
  requires_backup: true
