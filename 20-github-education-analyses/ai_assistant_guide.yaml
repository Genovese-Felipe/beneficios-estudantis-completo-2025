area_id: "20-github-education-analyses"
area_name: "GitHub Education Analyses"
version: "1.0.0"
last_updated: "2025-01-09"

description: >
  Comprehensive analyses of the GitHub Education ecosystem, including program evaluations,
  usage studies, best practices, case studies, and comparative research.

intended_agents:
  - type: "research_analyst"
    capabilities: ["data_analysis", "research", "comparative_evaluation"]
  - type: "content_synthesizer"
    capabilities: ["summarization", "insight_generation", "reporting"]
  - type: "educational_consultant"
    capabilities: ["program_evaluation", "best_practices", "recommendation"]

objectives:
  primary:
    - "Provide evidence-based analyses of GitHub Education programs"
    - "Document best practices and effective usage patterns"
    - "Support informed decision-making through comprehensive evaluations"
  secondary:
    - "Track evolution and trends in GitHub Education ecosystem"
    - "Identify gaps and opportunities for improvement"
    - "Build knowledge base for educational technology research"

scope:
  included:
    - "GitHub Student Developer Pack components"
    - "GitHub Campus Program features"
    - "GitHub Classroom capabilities"
    - "GitHub Codespaces for Education"
    - "GitHub Copilot for Students"
    - "Education-specific policies and features"
  
  excluded:
    - "General GitHub features (unless education-specific)"
    - "Non-GitHub educational platforms (covered elsewhere)"
    - "Detailed technical implementation (see 21-github-and-copilot-tech)"

inputs:
  - type: "program_documentation"
    sources: ["github.com/education", "docs.github.com", "education.github.com"]
    description: "Official GitHub Education documentation and announcements"
  
  - type: "usage_data"
    sources: ["surveys", "community_reports", "case_studies"]
    description: "Real-world usage patterns and outcomes"
  
  - type: "comparative_data"
    sources: ["competitor_offerings", "market_research", "academic_studies"]
    description: "Data for comparative analyses"

outputs:
  - type: "program_analyses"
    description: "Deep dives into specific GitHub Education programs"
    format: "markdown"
    structure:
      - "Executive summary"
      - "Program overview"
      - "Feature analysis"
      - "Value proposition"
      - "Best practices"
      - "Limitations and considerations"
  
  - type: "comparative_studies"
    description: "Systematic comparisons across programs or providers"
    format: "markdown"
    includes: ["comparison_matrices", "decision_frameworks", "recommendations"]
  
  - type: "case_studies"
    description: "Real-world implementation examples and outcomes"
    format: "markdown"
    structure:
      - "Context and background"
      - "Implementation approach"
      - "Results and metrics"
      - "Lessons learned"
      - "Recommendations"

policies:
  research_integrity:
    - "Cite all sources and evidence"
    - "Disclose methodology and assumptions"
    - "Note limitations and potential biases"
    - "Distinguish facts from opinions"
  
  objectivity:
    - "Present balanced view of strengths and weaknesses"
    - "Avoid promotional language"
    - "Include contrary evidence when exists"
    - "Acknowledge competing perspectives"
  
  currency:
    - "Include analysis date and version"
    - "Flag outdated content prominently"
    - "Update quarterly or when programs change"
    - "Archive rather than delete old analyses"

quality_checks:
  before_publication:
    - "Verify all links and sources"
    - "Check calculations and data accuracy"
    - "Review against current program state"
    - "Ensure proper citation format"
  
  content_standards:
    - "Include executive summary for documents >1000 words"
    - "Use consistent terminology across analyses"
    - "Provide actionable recommendations"
    - "Include visual aids for complex comparisons"
  
  peer_review:
    - "Technical accuracy verification"
    - "Clarity and readability check"
    - "Completeness assessment"
    - "Cross-reference validation"

operations:
  creating_new_analysis:
    steps:
      - "Define scope and research questions"
      - "Gather data from reliable sources"
      - "Conduct analysis using appropriate methods"
      - "Draft content following templates"
      - "Peer review for accuracy and clarity"
      - "Publish with proper metadata"
  
  updating_existing_analysis:
    steps:
      - "Check for program changes since last update"
      - "Review and update affected sections"
      - "Verify all sources still valid"
      - "Update timestamps and version"
      - "Note changes in revision history"

cross_references:
  related_areas:
    - area: "10-product-guide"
      relationship: "Product guide lists benefits; this area analyzes them deeply"
      linkage: "Reference analyses when questions arise about specific programs"
    
    - area: "21-github-and-copilot-tech"
      relationship: "This area provides strategic why; 21 provides tactical how"
      linkage: "Strategic analyses inform technical implementation guides"
    
    - area: "30-data"
      relationship: "Raw data supporting analyses"
      linkage: "Reference datasets and cite data provenance"
    
    - area: "00-governance-and-origins"
      relationship: "Research protocols and templates"
      linkage: "Follow research standards defined in governance"

metrics_to_track:
  - "Number of programs analyzed"
  - "Analysis freshness (days since update)"
  - "Citation count and source diversity"
  - "Community contribution rate"
  - "Usage/view statistics"

analysis_frameworks:
  program_evaluation:
    dimensions:
      - "Accessibility: How easy is it to obtain?"
      - "Value: What benefits does it provide?"
      - "Usability: How easy is it to use effectively?"
      - "Support: What resources are available?"
      - "Sustainability: Long-term viability?"
  
  comparative_analysis:
    criteria:
      - "Feature completeness"
      - "Cost/value ratio"
      - "Integration capabilities"
      - "Support and documentation"
      - "Community and ecosystem"

notes:
  - "Focus on analysis and insight, not basic description"
  - "Maintain objectivity even when advocating for improvements"
  - "Collaborate with educators and students for authentic perspectives"
  - "Content here should inform decisions, not just document facts"
  - "Balance depth with accessibility for diverse audiences"

metadata:
  primary_audience: "decision-makers"
  secondary_audience: ["researchers", "students", "educators"]
  content_type: "analytical"
  update_frequency: "quarterly"
  peer_review_required: true
