name: Repository Organization CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  validate-structure:
    name: Validate Repository Structure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyYAML
      
      - name: Check root cleanliness
        id: root-check
        run: |
          echo "Checking for non-metadata files at repository root..."
          
          # Define allowed files at root
          ALLOWED_FILES=(
            "README.md"
            "LICENSE"
            "LICENSE.md"
            "LICENSE.txt"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CHANGELOG.md"
            ".gitignore"
            ".gitattributes"
            "reorg-spec.yaml"
            "requirements.txt"
            "package.json"
            "package-lock.json"
            "pyproject.toml"
            "setup.py"
            "Makefile"
          )
          
          # Get all non-hidden files and directories at root (excluding .git, .github)
          ROOT_ITEMS=$(find . -maxdepth 1 -not -path '.' -not -path './.git' -not -path './.github' -not -path './.*' -type f -o -maxdepth 1 -not -path '.' -not -path './.git' -not -path './.github' -type d -not -name '.*')
          
          VIOLATIONS=0
          for item in $ROOT_ITEMS; do
            item_name=$(basename "$item")
            # Skip if it's a numbered directory (NN-*)
            if [[ -d "$item" ]] && [[ "$item_name" =~ ^[0-9]{2}- ]]; then
              continue
            fi
            # Check if file is in allowed list
            if [[ -f "$item" ]]; then
              if [[ ! " ${ALLOWED_FILES[@]} " =~ " ${item_name} " ]]; then
                echo "❌ Unexpected file at root: $item_name"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            fi
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::warning::Found $VIOLATIONS non-metadata file(s) at repository root"
            echo "root_clean=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Repository root is clean (only metadata files)"
            echo "root_clean=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Check top-level folder naming
        id: naming-check
        run: |
          echo "Checking top-level directory naming compliance..."
          
          VIOLATIONS=0
          for dir in */; do
            dir_name="${dir%/}"
            # Skip hidden directories
            if [[ "$dir_name" =~ ^\. ]]; then
              continue
            fi
            # Check if matches NN-kebab-case pattern
            if [[ ! "$dir_name" =~ ^[0-9]{2}-[a-z0-9-]+$ ]]; then
              echo "❌ Invalid directory name: $dir_name (should be NN-kebab-case)"
              VIOLATIONS=$((VIOLATIONS + 1))
            else
              echo "✅ Valid: $dir_name"
            fi
          done
          
          if [ $VIOLATIONS -gt 0 ]; then
            echo "::error::Found $VIOLATIONS directory naming violation(s)"
            echo "naming_compliant=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All top-level directories follow naming conventions"
            echo "naming_compliant=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Check required documentation
        id: docs-check
        run: |
          echo "Checking for required documentation files..."
          
          MISSING=0
          for dir in */; do
            dir_name="${dir%/}"
            # Skip hidden and non-numbered directories
            if [[ "$dir_name" =~ ^\. ]] || [[ ! "$dir_name" =~ ^[0-9]{2}- ]]; then
              continue
            fi
            
            # Check for README.md
            if [ ! -f "$dir/README.md" ]; then
              echo "⚠️ Missing README.md in $dir_name"
              MISSING=$((MISSING + 1))
            fi
            
            # Check for ai_assistant_guide.yaml
            if [ ! -f "$dir/ai_assistant_guide.yaml" ]; then
              echo "⚠️ Missing ai_assistant_guide.yaml in $dir_name"
              MISSING=$((MISSING + 1))
            fi
          done
          
          if [ $MISSING -gt 0 ]; then
            echo "::warning::Found $MISSING missing documentation file(s)"
            echo "docs_complete=false" >> $GITHUB_OUTPUT
          else
            echo "✅ All required documentation files present"
            echo "docs_complete=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Check duplicates index
        id: duplicates-check
        run: |
          echo "Checking for duplicates index..."
          
          INDEX_FILE="90-archive/duplicates/duplicates-index.csv"
          if [ ! -f "$INDEX_FILE" ]; then
            echo "⚠️ Duplicates index not found at $INDEX_FILE"
            echo "::warning::Duplicates index missing (OK on initial setup)"
            echo "index_exists=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Duplicates index exists"
            # Verify it has the header row
            HEADER=$(head -n 1 "$INDEX_FILE")
            if [[ "$HEADER" == "original_path,duplicate_path,sha256_hash,size_bytes,archived_date,detected_by" ]]; then
              echo "✅ Duplicates index has correct format"
              echo "index_exists=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Duplicates index has incorrect header"
              echo "::error::Duplicates index format is invalid"
              echo "index_exists=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi
      
      - name: Run reorg.py dry-run
        id: reorg-dry-run
        continue-on-error: true
        run: |
          echo "Running reorganization script in dry-run mode..."
          
          if [ -f "reorg-spec.yaml" ] && [ -f "40-scripts/reorg.py" ]; then
            python 40-scripts/reorg.py --dry-run > reorg-dry-run.log 2>&1
            EXIT_CODE=$?
            
            echo "=== Dry-run Output ==="
            cat reorg-dry-run.log
            
            if [ $EXIT_CODE -eq 0 ]; then
              echo "✅ Dry-run completed successfully"
              echo "dry_run_success=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Dry-run failed with exit code $EXIT_CODE"
              echo "::warning::Reorg dry-run failed - review logs"
              echo "dry_run_success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ Reorg script or spec not found - skipping"
            echo "dry_run_success=skipped" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload dry-run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reorg-dry-run-logs
          path: |
            reorg-dry-run.log
            21-github-and-copilot-tech/02-operations-logs/*.log
          retention-days: 30
          if-no-files-found: ignore
      
      - name: Summary
        run: |
          echo "## Repository Structure Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Root Cleanliness | ${{ steps.root-check.outputs.root_clean == 'true' && '✅ Pass' || '⚠️ Warning' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Naming Compliance | ${{ steps.naming-check.outputs.naming_compliant == 'true' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ steps.docs-check.outputs.docs_complete == 'true' && '✅ Complete' || '⚠️ Incomplete' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Duplicates Index | ${{ steps.duplicates-check.outputs.index_exists == 'true' && '✅ Exists' || '⚠️ Missing' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry-run Test | ${{ steps.reorg-dry-run.outputs.dry_run_success == 'true' && '✅ Success' || steps.reorg-dry-run.outputs.dry_run_success == 'skipped' && '⏭️ Skipped' || '⚠️ Failed' }} |" >> $GITHUB_STEP_SUMMARY
