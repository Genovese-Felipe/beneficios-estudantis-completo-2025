# Repository Reorganization Specification
# Version: 1.0.0
# Last Updated: 2025-01-09
# Status: Active (dry_run mode)

# Global settings
dry_run: true  # IMPORTANT: Set to false only after reviewing dry-run results

# Policies
policies:
  description: "Repository reorganization for governance, deduplication, and clarity"
  preserve_git_history: true
  archive_rather_than_delete: true
  maintain_audit_trail: true

# Directory structure to create/ensure
create_dirs:
  # Governance and foundational
  - "00-governance-and-origins"
  - "00-governance-and-origins/01-conversations"
  - "00-governance-and-origins/02-source-extractions"
  - "00-governance-and-origins/03-protocols"
  - "00-governance-and-origins/04-templates"
  
  # Product documentation
  - "10-product-guide"
  - "10-product-guide/assets"
  
  # Knowledge areas
  - "20-github-education-analyses"
  - "21-github-and-copilot-tech"
  - "21-github-and-copilot-tech/01-techniques"
  - "21-github-and-copilot-tech/02-operations-logs"
  - "21-github-and-copilot-tech/03-how-to"
  
  # Data and tools
  - "30-data"
  - "30-data/datasets"
  - "30-data/dictionaries"
  - "40-scripts"
  
  # Archive
  - "90-archive"
  - "90-archive/duplicates"
  - "90-archive/legacy"

# File move rules (executed after directory creation)
# Note: The script has already moved files; these are placeholders for future moves
move_rules: []

# Deduplication configuration
dedup_config:
  enabled: true
  
  # Directories to exclude from deduplication scan
  exclude_dirs:
    - ".git"
    - ".github"
    - "node_modules"
    - "__pycache__"
    - ".pytest_cache"
    - "venv"
    - "env"
    - ".venv"
    - "90-archive"  # Don't scan archive itself
  
  # Patterns to exclude (substring match)
  exclude_patterns:
    - "/.git/"
    - "/.github/"
    - "/node_modules/"
    - "/__pycache__/"
    - ".pyc"
    - ".pyo"
    - ".pyd"
    - ".so"
    - ".dll"
    - ".dylib"
  
  # Strategy for choosing which copy to keep
  keep_strategy: "first"  # Options: first, oldest, largest, smallest
  
  # Archive location for duplicates
  archive_location: "90-archive/duplicates"
  
  # Duplicate index file
  index_file: "90-archive/duplicates/duplicates-index.csv"

# Logging configuration
logging:
  operations_log_dir: "21-github-and-copilot-tech/02-operations-logs"
  log_format: "timestamp - operation: details"
  timestamp_format: "ISO-8601"

# Allowed files at repository root (metadata only)
root_allowlist:
  - "README.md"
  - "LICENSE"
  - "LICENSE.md"
  - "LICENSE.txt"
  - "CONTRIBUTING.md"
  - "CODE_OF_CONDUCT.md"
  - "SECURITY.md"
  - "CHANGELOG.md"
  - ".gitignore"
  - ".gitattributes"
  - "reorg-spec.yaml"
  - "requirements.txt"
  - "package.json"
  - "package-lock.json"
  - "pyproject.toml"
  - "setup.py"
  - "Makefile"

# Validation rules
validation:
  # Top-level directory naming pattern
  top_level_pattern: "^(\\d{2}-[a-z0-9-]+|\\.[a-z]+)$"
  
  # Required files per top-level directory
  required_files:
    - "README.md"
    - "ai_assistant_guide.yaml"
  
  # CI checks to perform
  ci_checks:
    - "root_cleanliness"          # Only allowlisted files at root
    - "naming_compliance"          # NN-kebab-case for top-level dirs
    - "documentation_completeness" # README.md and ai_assistant_guide.yaml present
    - "duplicates_index_exists"    # duplicates-index.csv exists

# Notes
notes: |
  This specification defines the repository reorganization structure.
  
  Key principles:
  1. Top-level directories use NN-kebab-case naming
  2. Repository root contains only metadata files
  3. Duplicates are archived, not deleted
  4. All operations are logged for transparency
  
  Process:
  1. Run in dry-run mode first: python 40-scripts/reorg.py --dry-run
  2. Review output and logs
  3. If acceptable, set dry_run: false and run: python 40-scripts/reorg.py --apply
  4. Verify results and complete documentation
  
  This is a living document - update as reorganization needs evolve.
