area_id: "10-product-guide"
area_name: "Product Guide"
version: "1.0.0"
last_updated: "2025-01-09"

description: >
  Comprehensive product documentation for student benefits, including complete guides,
  prioritized recommendations, economic impact analyses, and visual assets.

intended_agents:
  - type: "content_writer"
    capabilities: ["documentation", "content_creation", "formatting"]
  - type: "research_assistant"
    capabilities: ["data_gathering", "verification", "citation"]
  - type: "economic_analyst"
    capabilities: ["calculation", "data_analysis", "reporting"]

objectives:
  primary:
    - "Maintain comprehensive, accurate documentation of all student benefits"
    - "Provide clear prioritization to help students maximize value"
    - "Track and report economic impact of benefit programs"
  secondary:
    - "Keep documentation current with program changes"
    - "Improve discoverability and usability of information"
    - "Support evidence-based decision making"

inputs:
  - type: "benefit_programs"
    sources: ["official_websites", "program_documentation", "community_reports"]
    description: "Information about student benefit programs and offerings"
  
  - type: "economic_data"
    sources: ["pricing_pages", "cost_comparisons", "usage_statistics"]
    description: "Cost and value data for economic analysis"
  
  - type: "technical_details"
    location: "../21-github-and-copilot-tech/"
    description: "Technical implementation details and tutorials"

outputs:
  - type: "complete_guide"
    file: "GUIA-COMPLETO.md"
    description: "Comprehensive guide to all benefits, organized by category"
  
  - type: "priority_list"
    file: "TOP-50-PRIORIDADES.md"
    description: "Ranked list of top 50 most valuable benefits"
  
  - type: "economic_report"
    file: "ECONOMIA-CALCULADA.md"
    description: "Detailed economic impact and savings analysis"
  
  - type: "visual_assets"
    location: "assets/"
    description: "Supporting diagrams, screenshots, and images"

policies:
  content_accuracy:
    - "All benefit claims must link to official sources"
    - "Verify program eligibility requirements before publishing"
    - "Update documentation within 7 days of program changes"
    - "Flag outdated information with visible warnings"
  
  economic_reporting:
    - "Show methodology for all economic calculations"
    - "Use conservative estimates when ranges exist"
    - "Clearly distinguish between one-time and recurring savings"
    - "Update pricing data quarterly or when major changes occur"
  
  prioritization:
    - "Consider impact, accessibility, and relevance to tech students"
    - "Document rationale for ranking decisions"
    - "Re-evaluate priorities when new benefits emerge"
    - "Solicit community feedback on rankings"

quality_checks:
  content_validation:
    - "All links must be functional and point to official sources"
    - "Programs must include clear eligibility criteria"
    - "Code examples must be tested and working"
    - "Economic calculations must sum correctly"
  
  formatting_standards:
    - "Use consistent markdown formatting across all documents"
    - "Include table of contents for documents over 100 lines"
    - "Add update timestamps to major sections"
    - "Use proper heading hierarchy"
  
  accessibility:
    - "Alt text for all images in assets/"
    - "Clear, jargon-free language where possible"
    - "Provide examples for complex concepts"
    - "Multi-language support for key documents (future)"

operations:
  updating_content:
    steps:
      - "Verify new information against official sources"
      - "Update relevant sections in affected documents"
      - "Recalculate economic impact if pricing changes"
      - "Update cross-references in related areas"
      - "Add changelog entry noting modifications"
  
  adding_new_benefit:
    steps:
      - "Research and verify program details"
      - "Add to GUIA-COMPLETO.md in appropriate category"
      - "Evaluate for TOP-50-PRIORIDADES.md inclusion"
      - "Calculate economic value for ECONOMIA-CALCULADA.md"
      - "Create technical guide in 21-github-and-copilot-tech/ if needed"

cross_references:
  related_areas:
    - area: "21-github-and-copilot-tech"
      relationship: "Contains technical implementation guides for benefits documented here"
    - area: "20-github-education-analyses"
      relationship: "Provides deep analysis of GitHub Education ecosystem"
    - area: "30-data"
      relationship: "Source of structured data for economic calculations"
    - area: "00-governance-and-origins"
      relationship: "Historical context for documentation decisions"

metrics_to_track:
  - "Number of benefits documented"
  - "Economic value calculated (aggregate)"
  - "Document freshness (days since last update)"
  - "Link validity percentage"
  - "Community contributions received"

notes:
  - "Product guide is the primary user-facing documentation"
  - "Economic calculations should be conservative to maintain credibility"
  - "Technical depth should be limited; defer to 21-github-and-copilot-tech/ for details"
  - "Visual assets should follow consistent branding and style"

metadata:
  primary_audience: "students"
  secondary_audience: ["educators", "researchers", "contributors"]
  update_frequency: "continuous"
  review_cycle: "quarterly"
